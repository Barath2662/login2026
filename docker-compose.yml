version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: login2026_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: logindb
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: login2026_server
    restart: always
    depends_on:
      - db
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - FRONTEND_URL=http://localhost:5173
      # Uses local db container via docker network
      - DATABASE_URL=postgres://postgres:postgres@db:5432/logindb
      - LOCAL_DATABASE_URL=postgres://postgres:postgres@db:5432/logindb
      # Make sure to provide NEON_DATABASE_URL in server/.env or here if desired
    env_file:
      - ./server/.env

  client:
    build:
      context: ./client
      dockerfile: Dockerfile.prod
      args:
        # Defaults, can be overridden during build
        VITE_API_BASE_URL: /api
        VITE_API_URL: ''
    container_name: login2026_client
    restart: always
    ports:
      # Expose on 5173 on the host, internally Nginx runs on 80
      - "5173:80"
    env_file:
      - ./client/.env

  npm:
    image: jc21/nginx-proxy-manager:latest
    container_name: login2026_npm
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "81:81"
    volumes:
      - ./npm/data:/data
      - ./npm/letsencrypt:/etc/letsencrypt

volumes:
  pgdata:
