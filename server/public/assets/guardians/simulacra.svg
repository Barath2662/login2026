<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" fill="none">
  <defs>
    <linearGradient id="sGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3B30"/>
      <stop offset="100%" stop-color="#9A9AA2"/>
    </linearGradient>
  </defs>
  <rect width="300" height="400" fill="#0A0A0C" rx="16"/>
  <!-- Two-faced head: Solid Photoreal (Left) vs Wireframe (Right) -->
  <path d="M150 60 C 80 60, 80 200, 150 220 Z" fill="#141418" stroke="#E01B24" stroke-width="4"/>
  <path d="M150 60 C 220 60, 220 200, 150 220 Z" fill="none" stroke="#FF3B30" stroke-width="3" stroke-dasharray="6 4"/>
  <!-- Left Eye (Solid) -->
  <circle cx="120" cy="130" r="10" fill="#FF3B30"/>
  <!-- Right Eye (Wireframe Cross) -->
  <path d="M170 120 L190 140 M190 120 L170 140" stroke="#FF3B30" stroke-width="3"/>
  <!-- Wireframe Grid Lines on Right Half -->
  <line x1="150" y1="90" x2="210" y2="90" stroke="#2A1416" stroke-width="2"/>
  <line x1="150" y1="130" x2="215" y2="130" stroke="#2A1416" stroke-width="2"/>
  <line x1="150" y1="170" x2="200" y2="170" stroke="#2A1416" stroke-width="2"/>
  <line x1="180" y1="60" x2="180" y2="210" stroke="#2A1416" stroke-width="2"/>
  <text x="150" y="380" text-anchor="middle" font-family="'Orbitron', sans-serif" font-size="14" font-weight="800" fill="#F2F2F4">SIMULACRA // PIXEL PARADOX</text>
</svg>
