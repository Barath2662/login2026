<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" fill="none">
  <defs>
    <linearGradient id="tlsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3B30"/>
      <stop offset="50%" stop-color="#E01B24"/>
      <stop offset="100%" stop-color="#9B0A12"/>
    </linearGradient>
    <filter id="flagshipGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="300" height="400" fill="#0A0A0C" rx="16"/>
  <!-- Outer Aura -->
  <polygon points="150,30 270,100 270,290 150,350 30,290 30,100" stroke="url(#tlsGrad)" stroke-width="4" fill="#141418" filter="url(#flagshipGlow)"/>

  <!-- Colossal Kneeling Battle-Damaged Mech Silhouette -->
  <path d="M110 90 L190 90 L220 180 L200 300 L100 300 L80 180 Z" fill="#0A0A0C" stroke="#2A1416" stroke-width="4"/>
  <!-- Battle scars & glowing core -->
  <path d="M120 120 L160 140 M140 180 L180 160" stroke="#FF3B30" stroke-width="3"/>

  <!-- Central Star of LOGIN Core -->
  <polygon points="150,160 162,190 195,190 168,210 178,240 150,220 122,240 132,210 105,190 138,190" fill="url(#tlsGrad)" filter="url(#flagshipGlow)"/>

  <text x="150" y="380" text-anchor="middle" font-family="'Orbitron', sans-serif" font-size="14" font-weight="900" fill="#FF3B30" letter-spacing="2">★ THE LAST STANDING ★</text>
</svg>
