<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2A2A"/>
      <stop offset="50%" stop-color="#E01B22"/>
      <stop offset="100%" stop-color="#7E0910"/>
    </linearGradient>
    <filter id="coreGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Circuit Traces & Nodes -->
  <path d="M 40 100 L 140 100 L 170 130 L 170 200 M 360 100 L 260 100 L 230 130 L 230 200 M 40 300 L 140 300 L 170 270 M 360 300 L 260 300 L 230 270" stroke="#3E2529" stroke-width="2.5" fill="none"/>
  <rect x="136" y="96" width="8" height="8" fill="#E01B22"/>
  <rect x="256" y="96" width="8" height="8" fill="#E01B22"/>
  <rect x="136" y="296" width="8" height="8" fill="#E01B22"/>
  <rect x="256" y="296" width="8" height="8" fill="#E01B22"/>

  <!-- Outer Hex Shield -->
  <polygon points="200,50 320,115 320,275 200,340 80,275 80,115" stroke="url(#logoGrad)" stroke-width="7" fill="#130C0E" filter="url(#coreGlow)"/>
  <polygon points="200,75 298,128 298,262 200,315 102,262 102,128" stroke="#3E2529" stroke-width="2" fill="#0A0607"/>

  <!-- L Emblem Core -->
  <path d="M 135 125 L 135 265 L 255 265 L 255 215 L 185 215 L 185 125 Z" fill="url(#logoGrad)" filter="url(#coreGlow)"/>
  
  <!-- Year Badge 2026 -->
  <text x="200" y="375" text-anchor="middle" font-family="'Orbitron', sans-serif" font-size="22" font-weight="900" fill="#F7F2F2" letter-spacing="6">LOGIN 2026</text>
  <text x="200" y="392" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#A79798" letter-spacing="3">THE LAST HUMAN</text>
</svg>
